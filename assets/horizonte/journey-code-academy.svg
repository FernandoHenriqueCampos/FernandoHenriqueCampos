<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="372" viewBox="0 0 1440 372" role="img" aria-labelledby="title desc">
<title id="title">Code Academy — 2026</title><desc id="desc">2026 · Code Academy · Instituto 3C. Revisão e consolidação de conhecimentos, aprofundamento de fundamentos e aprendizado de novas tecnologias. Vue.js, JavaScript, TypeScript, HTML, CSS, Git, GitHub e Docker. O contato com infraestrutura fortaleceu meu interesse por DevOps e por como aplicações são estruturadas, executadas e preparadas para diferentes ambientes.</desc>
