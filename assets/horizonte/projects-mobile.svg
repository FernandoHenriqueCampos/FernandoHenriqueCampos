<title id="title">Projetos — Adote Já e processos internos na Michelc</title><desc id="desc">Adote Já: aplicativo React Native desenvolvido em equipe. Michelc: solução interna em desenvolvimento para organizar processos, fluxos, informações, responsabilidades e colaboração entre funcionários.</desc>
