<title id="title">Serratec — 2025</title><desc id="desc">2025 · Serratec · Residência em TIC. Formação imersiva Full Stack: seis meses em período integral, com projetos práticos e colaboração. Aplicações web e mobile, APIs, bancos de dados, versionamento e metodologias ágeis. Projeto final para uma empresa parceira: da compreensão da necessidade ao planejamento, desenvolvimento, integração e entrega.</desc>
