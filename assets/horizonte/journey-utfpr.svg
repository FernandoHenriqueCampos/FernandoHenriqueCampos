  <linearGradient id="fade"><stop stop-color="#a3dce4" stop-opacity="0"/><stop offset=".5" stop-color="#a3dce4" stop-opacity=".7"/><stop offset="1" stop-color="#a3dce4" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
