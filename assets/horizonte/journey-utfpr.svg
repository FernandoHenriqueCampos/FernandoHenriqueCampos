<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">UTFPR — 2026 — ATUAL</title><desc id="desc">2026 — ATUAL · UTFPR · Tecnologia em Sistemas para Internet. Graduação escolhida para aprofundar os conhecimentos que a prática profissional começou a exigir. Algoritmos, raciocínio computacional, fundamentos, arquitetura, bancos de dados, redes, infraestrutura e engenharia de software. Aprofundamento em DevOps para entender como sistemas funcionam, por que decisões técnicas são tomadas e como aplicações são executadas e mantidas. Uma base em tecnologia e engenharia que complementa a experiência prática, para ir além dos frameworks.</desc>
