<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1250" viewBox="0 0 720 1250" role="img" aria-labelledby="title desc">
<title id="title">Tecnologias — um sistema, várias camadas</title><desc id="desc">Interface: React, Next.js, Vue.js, React Native, TypeScript, JavaScript. Backend: Python, FastAPI, Java, Spring. Data: PostgreSQL, Supabase, SQLite. Infrastructure: Docker, Git, GitHub. Órbitas conceituais, sem indicar proficiência ou tempo de experiência.</desc>
