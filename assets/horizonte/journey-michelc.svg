  <radialGradient id="sphere" cx=".24" cy=".16" r=".84"><stop stop-color="#304450"/><stop offset=".23" stop-color="#13202d"/><stop offset=".6" stop-color="#090f19"/><stop offset="1" stop-color="#03070c"/></radialGradient>
