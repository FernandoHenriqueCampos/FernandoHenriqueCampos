<g transform="translate(80 42)" fill="none" stroke="#a3dce4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="34" height="42" rx="2"/><path d="M16 12h4m8 0h4m-16 9h4m8 0h4m-16 9h4m8 0h4M20 45V36h8v9"/></g><text x="152" y="71" font-family="Consolas, monospace" font-size="19" font-weight="400" fill="#a3dce4" letter-spacing="1">2026 — ATUAL</text><text x="80" y="139" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" fill="#edf3f5" letter-spacing="-1">Michelc</text><text x="80" y="181" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#a4b3c2">Assessoria Contábil</text><path d="M435 44L435 220" stroke="#263541" stroke-width="1" opacity="1"/><text x="480" y="66" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#a3dce4">APROX. 90 MIN → ATÉ 10 MIN</text><text x="480" y="120" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">Full Stack Trainee: criação, manutenção e evolução de sistemas internos;</text><text x="480" y="156" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">novas funcionalidades e correções em aplicações existentes.</text><text x="480" y="212" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">Atuação em necessidades, planejamento, arquitetura, interfaces, APIs,</text><text x="480" y="248" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">bancos de dados, autenticação, permissões, regras de negócio, testes e</text><text x="480" y="284" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">decisões técnicas.</text><text x="480" y="340" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">Automação fiscal com React, Next.js, FastAPI e PostgreSQL para reunir,</text><text x="480" y="376" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">analisar e calcular informações, reduzindo a intervenção manual.</text><text x="480" y="432" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">Em desenvolvimento: solução interna para organizar processos, fluxos,</text><text x="480" y="468" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">responsabilidades, informações e colaboração entre funcionários, com</text><text x="480" y="504" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">elementos de uma rede social corporativa.</text><text x="480" y="560" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">Da compreensão da operação à definição de requisitos e decisões de</text><text x="480" y="596" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#edf3f5">arquitetura tecnicamente viáveis.</text><path d="M80 660H1360" stroke="#263541" stroke-width="1" opacity="1"/>
