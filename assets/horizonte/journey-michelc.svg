<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="682" viewBox="0 0 1440 682" role="img" aria-labelledby="title desc">
<title id="title">Michelc — 2026 — ATUAL</title><desc id="desc">2026 — ATUAL · Michelc · Assessoria Contábil. Impacto fiscal: aprox. 90 min → até 10 min. Full Stack Trainee: criação, manutenção e evolução de sistemas internos; novas funcionalidades e correções em aplicações existentes. Atuação em necessidades, planejamento, arquitetura, interfaces, APIs, bancos de dados, autenticação, permissões, regras de negócio, testes e decisões técnicas. Automação fiscal com React, Next.js, FastAPI e PostgreSQL para reunir, analisar e calcular informações, reduzindo a intervenção manual. Em desenvolvimento: solução interna para organizar processos, fluxos, responsabilidades, informações e colaboração entre funcionários, com elementos de uma rede social corporativa. Da compreensão da operação à definição de requisitos e decisões de arquitetura tecnicamente viáveis.</desc>
