="#edf3f5">negócio, testes e decisões técnicas.</text><text x="40" y="632" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">Automação fiscal com React, Next.js, FastAPI e</text><text x="40" y="668" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">PostgreSQL para reunir, analisar e calcular</text><text x="40" y="704" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">informações, reduzindo a intervenção manual.</text><text x="40" y="760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">Em desenvolvimento: solução interna para</text><text x="40" y="796" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">organizar processos, fluxos,</text><text x="40" y="832" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">responsabilidades, informações e colaboração</text><text x="40" y="868" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">entre funcionários, com elementos de uma rede</text><text x="40" y="904" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">social corporativa.</text><text x="40" y="960" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">Da compreensão da operação à definição de</text><text x="40" y="996" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">requisitos e decisões de arquitetura</text><text x="40" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#edf3f5">tecnicamente viáveis.</text><path d="M40 1096H680" stroke="#263541" stroke-width="1" opacity="1"/>
