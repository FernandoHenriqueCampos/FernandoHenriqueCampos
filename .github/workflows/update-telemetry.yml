name: Update Horizonte telemetry

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: horizonte-telemetry
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch public data and update existing SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 design/update_telemetry.py
      - name: Commit only changed telemetry files
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/horizonte/telemetry.json assets/horizonte/telemetry.svg assets/horizonte/telemetry-mobile.svg
          if git diff --cached --quiet; then
            echo 'No real data changes. Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update Horizonte telemetry'
          git push
