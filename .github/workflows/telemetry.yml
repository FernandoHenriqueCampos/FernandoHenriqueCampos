name: Refresh public profile telemetry
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect public data and render SVGs
        run: python3 design/update_telemetry.py
      - name: Commit updated snapshot
        run: |
          git add assets/horizonte/telemetry.json assets/horizonte/telemetry.svg assets/horizonte/telemetry-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public profile telemetry'
          git push
